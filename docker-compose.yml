version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: signaturechair-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-signaturechair}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-signaturechair_password}
      POSTGRES_DB: ${POSTGRES_DB:-signaturechair_booking}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-signaturechair}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: signaturechair-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-signaturechair}:${POSTGRES_PASSWORD:-signaturechair_password}@postgres:5432/${POSTGRES_DB:-signaturechair_booking}?schema=public
      PORT: ${PORT:-3000}
      NODE_ENV: ${NODE_ENV:-production}
      SQUARE_ACCESS_TOKEN: ${SQUARE_ACCESS_TOKEN}
      SQUARE_ENVIRONMENT: ${SQUARE_ENVIRONMENT:-sandbox}
      SQUARE_LOCATION_ID: ${SQUARE_LOCATION_ID}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./logs:/app/logs
    command: sh -c "npx prisma migrate deploy && npm start"

volumes:
  postgres_data:
    driver: local
