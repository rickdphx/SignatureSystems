server {
    listen 80;
    listen [::]:80;
    server_name signaturebrain.com www.signaturebrain.com;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name signaturebrain.com www.signaturebrain.com;

    # SSL configuration (update paths to your actual certificate locations)
    ssl_certificate /etc/letsencrypt/live/signaturebrain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/signaturebrain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Logging
    access_log /var/log/nginx/signaturebrain_access.log;
    error_log /var/log/nginx/signaturebrain_error.log;

    # Root directory for static frontend files
    root /home/ubuntu/signaturebrain-frontend/build;
    index index.html;

    # Backend API proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }

    # Admin section - serve from React app (will handle routing)
    location /admin {
        try_files $uri $uri/ /index.html;
    }

    # Main location - React app with client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets with caching
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Favicon and manifest
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /manifest.json {
        expires 1d;
    }
}
