# HTTPS Server Block (port 443)
# This configuration should be added to your existing HTTPS server block for signaturebrain.com

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name signaturebrain.com www.signaturebrain.com;

    # SSL configuration (update paths as needed for your SSL certificates)
    # ssl_certificate /path/to/your/fullchain.pem;
    # ssl_certificate_key /path/to/your/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;

    # Serve the admin UI from static files
    location /admin {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        alias /var/www/signaturebrain/admin-ui;
        try_files $uri $uri/ /admin/index.html;
        index index.html;
    }

    # WebSocket proxy for terminal responses
    location /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Add other location blocks as needed for your site
    # ...
}

# HTTP Server Block (port 80) - Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name signaturebrain.com www.signaturebrain.com;

    # Serve the admin UI from static files (for HTTP access if needed)
    location /admin {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        alias /var/www/signaturebrain/admin-ui;
        try_files $uri $uri/ /admin/index.html;
        index index.html;
    }

    # WebSocket proxy for terminal responses (HTTP)
    location /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Optionally redirect all HTTP to HTTPS (uncomment if desired)
    # return 301 https://$server_name$request_uri;
}
