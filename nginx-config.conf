# Nginx configuration for Ben Console at signaturebrain.com
# This should be added to your nginx sites-available configuration

# Upstream Node.js server
upstream ben_console {
    server localhost:3000;
}

server {
    listen 80;
    server_name signaturebrain.com;

    # Ben Console at /bg/ (protected route)
    location /bg/ {
        proxy_pass http://ben_console;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Ben Console at /ben (public route)
    location /ben {
        proxy_pass http://ben_console;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Other routes (standalone, download, etc.)
    location /standalone {
        proxy_pass http://ben_console;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /download {
        proxy_pass http://ben_console;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Existing configuration for other routes...
    # Add your other location blocks here
}
