<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nando Blends - Premium Grooming</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #000000 0%, #1a1a1a 50%, #0d0d0d 100%);
      color: #ffffff;
      min-height: 100vh;
      line-height: 1.6;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 80px 40px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 4rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 20px;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #ffffff, #cccccc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      text-align: center;
      font-size: 1.1rem;
      color: #aaa;
      margin-bottom: 60px;
      font-weight: 300;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .form-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 60px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
      transition: all 0.3s ease;
    }

    .form-card:hover {
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.9);
    }

    .form-group {
      margin-bottom: 40px;
      position: relative;
    }

    label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #ffffff;
      margin-bottom: 12px;
      font-weight: 600;
    }

    input,
    textarea {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: none;
      border-bottom: 2px solid rgba(255, 255, 255, 0.2);
      padding: 16px 0;
      font-size: 1.1rem;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      transition: all 0.3s ease;
      outline: none;
    }

    input:focus,
    textarea:focus {
      background: rgba(0, 0, 0, 0.6);
      border-bottom-color: #ffffff;
      padding-left: 12px;
    }

    input::placeholder,
    textarea::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    textarea {
      resize: vertical;
      min-height: 140px;
    }

    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, #ffffff, #cccccc);
      border: 2px solid #ffffff;
      color: #000000;
      padding: 20px;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 10px;
      transition: all 0.4s ease;
      position: relative;
      overflow: hidden;
    }

    .submit-btn:hover {
      background: linear-gradient(135deg, #cccccc, #ffffff);
      transform: translateY(-3px);
      box-shadow: 0 15px 40px rgba(255, 255, 255, 0.3);
    }

    .submit-btn:active {
      transform: translateY(-1px);
    }

    .success-message {
      text-align: center;
      padding: 80px 40px;
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid #ffffff;
      border-radius: 20px;
      animation: fadeIn 0.5s ease;
    }

    .success-message h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      color: #ffffff;
      margin-bottom: 20px;
    }

    .success-message p {
      font-size: 1.1rem;
      color: #ccc;
      margin-bottom: 40px;
      line-height: 1.8;
    }

    .reset-btn {
      background: transparent;
      border: 1px solid #ffffff;
      color: #ffffff;
      padding: 12px 40px;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.3s ease;
    }

    .reset-btn:hover {
      background: #ffffff;
      color: #000000;
    }

    .location-info {
      margin-top: 80px;
      text-align: center;
      padding-top: 60px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
    }

    .location-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #ffffff;
      margin-bottom: 16px;
      font-weight: 600;
    }

    .location-text {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      color: #ffffff;
      font-weight: 400;
    }

    .back-link {
      text-align: center;
      margin-top: 40px;
    }

    .back-link a {
      color: #ffffff;
      text-decoration: none;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      border-bottom: 1px solid transparent;
      transition: all 0.3s ease;
      padding-bottom: 4px;
    }

    .back-link a:hover {
      border-bottom-color: #ffffff;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .form-card {
      animation: fadeIn 0.6s ease;
    }

    @media (max-width: 768px) {
      .container {
        padding: 40px 20px;
      }

      h1 {
        font-size: 2.5rem;
      }

      .form-card {
        padding: 40px 30px;
      }

      .location-text {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Nando Blends</h1>
    <p class="subtitle">Get in Touch</p>

    <div id="formContainer">
      <div class="form-card">
        <form id="contactForm">
          <div class="form-group">
            <label for="name">Your Name</label>
            <input
              type="text"
              id="name"
              name="name"
              required
              placeholder="Enter your full name"
            />
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              name="email"
              required
              placeholder="your@email.com"
            />
          </div>

          <div class="form-group">
            <label for="message">Your Message</label>
            <textarea
              id="message"
              name="message"
              required
              placeholder="Tell us what you're looking for..."
            ></textarea>
          </div>

          <button type="submit" class="submit-btn">Send Message</button>
        </form>
      </div>
    </div>

    <div class="location-info">
      <p class="location-label">Our Location</p>
      <p class="location-text">Tempe • Phoenix • Scottsdale • Sky Harbor</p>
    </div>

    <div class="back-link">
      <a href="/">← Back to Home</a>
    </div>
  </div>

  <script>
    document.getElementById('contactForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const formContainer = document.getElementById('formContainer');

      formContainer.innerHTML = '<div class="success-message"><h2>Thank You!</h2><p>We\'ve received your message and will get back to you shortly.<br>Our team typically responds within 24 hours.</p><button onclick="resetForm()" class="reset-btn">Send Another Message</button></div>';
    });

    function resetForm() {
      const formContainer = document.getElementById('formContainer');

      formContainer.innerHTML = '<div class="form-card"><form id="contactForm"><div class="form-group"><label for="name">Your Name</label><input type="text" id="name" name="name" required placeholder="Enter your full name" /></div><div class="form-group"><label for="email">Email Address</label><input type="email" id="email" name="email" required placeholder="your@email.com" /></div><div class="form-group"><label for="message">Your Message</label><textarea id="message" name="message" required placeholder="Tell us what you\'re looking for..."></textarea></div><button type="submit" class="submit-btn">Send Message</button></form></div>';

      document.getElementById('contactForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const formContainer = document.getElementById('formContainer');
        formContainer.innerHTML = '<div class="success-message"><h2>Thank You!</h2><p>We\'ve received your message and will get back to you shortly.<br>Our team typically responds within 24 hours.</p><button onclick="resetForm()" class="reset-btn">Send Another Message</button></div>';
      });
    }
  </script>
</body>
</html>
