<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEN Admin Panel</title>
    <style>
        :root {
            --bg-primary: #0a0e27;
            --bg-secondary: #1a1f3a;
            --bg-tertiary: #0d1117;
            --border-color: #2a3f5f;
            --border-light: #30363d;
            --text-primary: #e0e0e0;
            --text-secondary: #8b949e;
            --accent-blue: #4a9eff;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-yellow: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* Header */
        .header {
            background: var(--bg-secondary);
            padding: 1.25rem 2rem;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .header h1 {
            color: var(--accent-blue);
            font-size: 1.5rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .header-icon {
            font-size: 1.75rem;
        }

        .status-bar {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .status.connected {
            background: rgba(34, 197, 94, 0.1);
            color: var(--accent-green);
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        .status.disconnected {
            background: rgba(239, 68, 68, 0.1);
            color: var(--accent-red);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .status-dot {
            width: 0.5rem;
            height: 0.5rem;
            border-radius: 50%;
            background: currentColor;
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .metric {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .metric-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .metric-value {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--accent-blue);
            font-variant-numeric: tabular-nums;
        }

        /* Main Layout */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        /* Panel Styles */
        .panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            padding: 1.5rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .panel:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border-light);
        }

        .panel h2 {
            color: var(--accent-blue);
            font-size: 1.125rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .panel-icon {
            font-size: 1.25rem;
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-light);
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            color: var(--text-primary);
            font-size: 0.875rem;
            font-family: 'SF Mono', 'Monaco', 'Cascadia Code', 'Courier New', monospace;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-blue);
            background: rgba(74, 158, 255, 0.05);
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: var(--text-secondary);
            opacity: 0.5;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
            font-family: 'SF Mono', 'Monaco', 'Cascadia Code', 'Courier New', monospace;
        }

        /* Input with icon */
        .input-with-icon {
            position: relative;
        }

        .input-icon {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .input-icon:hover {
            color: var(--accent-blue);
        }

        /* Buttons */
        .btn-group {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--accent-blue);
            color: white;
        }

        .btn-primary:hover {
            background: #3a8eef;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(74, 158, 255, 0.3);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-light);
        }

        .btn-secondary:hover {
            background: var(--border-light);
        }

        .btn-success {
            background: var(--accent-green);
            color: white;
        }

        .btn-success:hover {
            background: #16a34a;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Save Indicator */
        .save-indicator {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--accent-green);
            font-size: 0.875rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .save-indicator.show {
            opacity: 1;
        }

        /* Terminal */
        .terminal {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-light);
            border-radius: 0.5rem;
            padding: 1rem;
            font-family: 'SF Mono', 'Monaco', 'Cascadia Code', 'Courier New', monospace;
            font-size: 0.8125rem;
            max-height: 350px;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .terminal::-webkit-scrollbar {
            width: 8px;
        }

        .terminal::-webkit-scrollbar-track {
            background: var(--bg-tertiary);
        }

        .terminal::-webkit-scrollbar-thumb {
            background: var(--border-light);
            border-radius: 4px;
        }

        .terminal-line {
            padding: 0.375rem 0;
            border-bottom: 1px solid rgba(48, 54, 61, 0.3);
            display: flex;
            gap: 0.75rem;
        }

        .terminal-line:last-child {
            border-bottom: none;
        }

        .timestamp {
            color: var(--text-secondary);
            flex-shrink: 0;
            font-size: 0.75rem;
        }

        .output {
            color: var(--accent-blue);
            flex: 1;
        }

        .output.success { color: var(--accent-green); }
        .output.error { color: var(--accent-red); }
        .output.warning { color: var(--accent-yellow); }

        .uptime {
            color: #7ee787;
            flex-shrink: 0;
            font-size: 0.75rem;
        }

        /* Full width panels */
        .full-width {
            grid-column: 1 / -1;
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }

            .status-bar {
                width: 100%;
                justify-content: space-between;
            }

            .container {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>
            <span class="header-icon">⚡</span>
            BEN Admin Panel
        </h1>
        <div class="status-bar">
            <div class="status disconnected" id="status">
                <span class="status-dot"></span>
                <span id="status-text">Connecting...</span>
            </div>
            <div class="metric">
                <div class="metric-label">Uptime</div>
                <div class="metric-value" id="uptime-display">0s</div>
            </div>
            <div class="metric">
                <div class="metric-label">Clients</div>
                <div class="metric-value" id="clients-display">0</div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="grid">
            <!-- API Configuration Panel -->
            <div class="panel">
                <div class="panel-header">
                    <h2><span class="panel-icon">🔑</span> API Configuration</h2>
                </div>
                <div class="form-group">
                    <label>OpenAI API Key</label>
                    <div class="input-with-icon">
                        <input type="password" id="openai-key" placeholder="sk-..." autocomplete="off">
                        <span class="input-icon" onclick="togglePasswordVisibility('openai-key')">👁️</span>
                    </div>
                </div>
                <div class="form-group">
                    <label>Anthropic API Key</label>
                    <div class="input-with-icon">
                        <input type="password" id="anthropic-key" placeholder="sk-ant-..." autocomplete="off">
                        <span class="input-icon" onclick="togglePasswordVisibility('anthropic-key')">👁️</span>
                    </div>
                </div>
                <div class="form-group">
                    <label>Custom API Endpoint</label>
                    <input type="text" id="custom-endpoint" placeholder="https://api.example.com">
                </div>
                <div class="form-group">
                    <label>Custom API Key</label>
                    <div class="input-with-icon">
                        <input type="password" id="custom-key" placeholder="Your API key" autocomplete="off">
                        <span class="input-icon" onclick="togglePasswordVisibility('custom-key')">👁️</span>
                    </div>
                </div>
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="saveConfig()">
                        <span>💾</span> Save Configuration
                    </button>
                    <span class="save-indicator" id="save-indicator">
                        <span>✓</span> Saved
                    </span>
                </div>
            </div>

            <!-- BEN Integration Panel -->
            <div class="panel">
                <div class="panel-header">
                    <h2><span class="panel-icon">🤖</span> BEN Integration</h2>
                </div>
                <div class="form-group">
                    <label>BEN Service URL</label>
                    <input type="text" id="ben-url" placeholder="https://ben.example.com">
                </div>
                <div class="form-group">
                    <label>BEN API Token</label>
                    <div class="input-with-icon">
                        <input type="password" id="ben-token" placeholder="Bearer token" autocomplete="off">
                        <span class="input-icon" onclick="togglePasswordVisibility('ben-token')">👁️</span>
                    </div>
                </div>
                <div class="form-group">
                    <label>Webhook URL</label>
                    <input type="text" id="webhook-url" placeholder="https://yoursite.com/webhook">
                </div>
                <div class="form-group">
                    <label>Configuration (JSON)</label>
                    <textarea id="ben-config" placeholder='{
  "model": "gpt-4",
  "temperature": 0.7,
  "max_tokens": 2000
}'></textarea>
                </div>
                <div class="btn-group">
                    <button class="btn btn-success" onclick="testConnection()">
                        <span>🔌</span> Test Connection
                    </button>
                    <button class="btn btn-primary" onclick="saveConfig()">
                        <span>💾</span> Save Settings
                    </button>
                </div>
            </div>
        </div>

        <!-- Terminal Panel -->
        <div class="panel full-width">
            <div class="panel-header">
                <h2><span class="panel-icon">💻</span> System Terminal</h2>
                <button class="btn btn-secondary" onclick="clearTerminal()" style="padding: 0.5rem 1rem; font-size: 0.75rem;">
                    Clear
                </button>
            </div>
            <div class="terminal" id="terminal">
                <div class="terminal-line">
                    <span class="timestamp">[System]</span>
                    <span class="output">Initializing BEN Admin Panel...</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_TOKEN = 'admin-token-12345';
        const terminal = document.getElementById('terminal');
        const statusEl = document.getElementById('status');
        const statusText = document.getElementById('status-text');
        const uptimeDisplay = document.getElementById('uptime-display');
        const clientsDisplay = document.getElementById('clients-display');

        let ws = null;
        let currentUptime = 0;
        let reconnectAttempts = 0;

        // Toggle password visibility
        function togglePasswordVisibility(inputId) {
            const input = document.getElementById(inputId);
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        // Format uptime
        function formatUptime(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;
            if (h > 0) return `${h}h ${m}m ${s}s`;
            if (m > 0) return `${m}m ${s}s`;
            return `${s}s`;
        }

        // Add log to terminal
        function addLog(message, type = 'info') {
            const line = document.createElement('div');
            line.className = 'terminal-line';
            const time = new Date().toLocaleTimeString();
            const outputClass = type === 'error' ? 'error' : type === 'success' ? 'success' : type === 'warning' ? 'warning' : '';
            line.innerHTML = `<span class="timestamp">[${time}]</span><span class="output ${outputClass}">${message}</span>`;
            terminal.appendChild(line);
            terminal.scrollTop = terminal.scrollHeight;
        }

        // Clear terminal
        function clearTerminal() {
            terminal.innerHTML = '<div class="terminal-line"><span class="timestamp">[System]</span><span class="output">Terminal cleared</span></div>';
        }

        // Update connection status
        function updateStatus(connected) {
            statusEl.className = connected ? 'status connected' : 'status disconnected';
            statusText.textContent = connected ? 'Connected' : 'Disconnected';
            if (connected) reconnectAttempts = 0;
        }

        // Save configuration
        async function saveConfig() {
            const config = {
                apis: {
                    openai: document.getElementById('openai-key').value,
                    anthropic: document.getElementById('anthropic-key').value,
                    custom: {
                        endpoint: document.getElementById('custom-endpoint').value,
                        key: document.getElementById('custom-key').value
                    }
                },
                benIntegration: {
                    url: document.getElementById('ben-url').value,
                    token: document.getElementById('ben-token').value,
                    webhookUrl: document.getElementById('webhook-url').value,
                    config: document.getElementById('ben-config').value
                }
            };

            try {
                const response = await fetch(`/api/config`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${ADMIN_TOKEN}`
                    },
                    body: JSON.stringify(config)
                });

                if (response.ok) {
                    addLog('✓ Configuration saved successfully', 'success');
                    const indicator = document.getElementById('save-indicator');
                    indicator.classList.add('show');
                    setTimeout(() => indicator.classList.remove('show'), 2000);
                } else {
                    addLog('✗ Failed to save configuration', 'error');
                }
            } catch (error) {
                addLog(`✗ Error: ${error.message}`, 'error');
            }
        }

        // Test connection
        async function testConnection() {
            const benUrl = document.getElementById('ben-url').value;
            if (!benUrl) {
                addLog('⚠ BEN Service URL not configured', 'warning');
                return;
            }

            addLog('Testing connection to BEN service...', 'info');

            try {
                const response = await fetch(`/api/test-connection`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${ADMIN_TOKEN}`
                    },
                    body: JSON.stringify({ service: 'ben', url: benUrl })
                });

                const result = await response.json();
                if (result.success) {
                    addLog(`✓ ${result.message}`, 'success');
                } else {
                    addLog(`✗ ${result.message}`, 'error');
                }
            } catch (error) {
                addLog(`✗ Connection test failed: ${error.message}`, 'error');
            }
        }

        // WebSocket connection
        function connect() {
            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${wsProtocol}//${window.location.host}/ws?token=${ADMIN_TOKEN}`;

            addLog(`Connecting to ${wsUrl}...`);
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                addLog('✓ WebSocket connected', 'success');
                updateStatus(true);
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);

                    switch (data.type) {
                        case 'auth_success':
                            addLog(`✓ ${data.message}`, 'success');
                            break;
                        case 'terminal':
                            currentUptime = data.data.uptime;
                            uptimeDisplay.textContent = formatUptime(currentUptime);
                            if (data.data.clients) {
                                clientsDisplay.textContent = data.data.clients;
                            }
                            const line = document.createElement('div');
                            line.className = 'terminal-line';
                            const time = new Date(data.timestamp).toLocaleTimeString();
                            line.innerHTML = `<span class="timestamp">[${time}]</span><span class="output">${data.data.output}</span><span class="uptime">↑ ${formatUptime(currentUptime)}</span>`;
                            terminal.appendChild(line);
                            terminal.scrollTop = terminal.scrollHeight;
                            break;
                        case 'config_updated':
                            addLog(`⚠ ${data.message}`, 'warning');
                            break;
                    }
                } catch (e) {
                    addLog(`✗ Parse error: ${e.message}`, 'error');
                }
            };

            ws.onerror = () => {
                addLog('✗ WebSocket error occurred', 'error');
                updateStatus(false);
            };

            ws.onclose = () => {
                addLog('✗ Connection closed', 'error');
                updateStatus(false);

                reconnectAttempts++;
                const delay = Math.min(5000 * reconnectAttempts, 30000);
                addLog(`⟳ Reconnecting in ${delay / 1000}s (attempt ${reconnectAttempts})...`, 'warning');
                setTimeout(connect, delay);
            };
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            addLog('BEN Admin Panel initialized', 'success');
            connect();
        });
    </script>
</body>
</html>
