<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEN Admin Panel</title>
    <style>
        :root {
            --bg-primary: #0a0e27;
            --bg-secondary: #1a1f3a;
            --bg-tertiary: #0d1117;
            --border-color: #2a3f5f;
            --border-light: #30363d;
            --text-primary: #e0e0e0;
            --text-secondary: #8b949e;
            --accent-blue: #4a9eff;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-yellow: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        .header {
            background: var(--bg-secondary);
            padding: 1.25rem 2rem;
            border-bottom: 2px solid var(--border-color);
        }

        .header h1 {
            color: var(--accent-blue);
            font-size: 1.5rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .panel h2 {
            color: var(--accent-blue);
            font-size: 1.125rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }

        .form-group input {
            width: 100%;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-light);
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            color: var(--text-primary);
            font-size: 0.875rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            cursor: pointer;
            background: var(--accent-blue);
            color: white;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>⚡ BEN Admin Panel</h1>
    </div>

    <div class="container">
        <div class="panel">
            <h2>🔑 AI Models Configuration</h2>
            <div class="form-group">
                <label>Grok API Key (Primary Model)</label>
                <input type="password" id="grok-key" placeholder="xai-...">
            </div>
            <div class="form-group">
                <label>Grok Model</label>
                <input type="text" id="grok-model" value="grok-beta">
            </div>
            <div class="form-group">
                <label>Claude API Key (Deep Reasoning)</label>
                <input type="password" id="claude-key" placeholder="sk-ant-...">
            </div>
            <div class="form-group">
                <label>Claude Model</label>
                <input type="text" id="claude-model" value="claude-3-5-sonnet-20241022">
            </div>
            <button class="btn">💾 Save Configuration</button>
        </div>

        <div class="panel">
            <h2>🧠 BEN Console</h2>
            <div class="form-group">
                <label>Mode</label>
                <select style="width:100%;background:var(--bg-tertiary);border:1px solid var(--border-light);border-radius:0.5rem;padding:0.75rem;color:var(--text-primary);">
                    <option>Normal</option>
                    <option>Deep Reasoning</option>
                    <option>Torah Mode</option>
                    <option>Research</option>
                    <option>Execute</option>
                </select>
            </div>
            <div class="form-group">
                <label>Prompt</label>
                <textarea style="width:100%;min-height:120px;background:var(--bg-tertiary);border:1px solid var(--border-light);border-radius:0.5rem;padding:0.75rem;color:var(--text-primary);"></textarea>
            </div>
            <button class="btn">🚀 Submit</button>
        </div>
    </div>
</body>
</html>
